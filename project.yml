name: YachtDice
options:
  bundleIdPrefix: com.leejungheon.yachtdice
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

packages:
  YachtCore:
    path: Packages/YachtCore
  GameCore:
    path: Packages/GameCore
  DiceTrajectory:
    path: Packages/DiceTrajectory
  YachtBot:
    path: Packages/YachtBot
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.1

targets:
  YachtDice:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        # 세로 전용 iPhone 앱이다. 비워두면 iPad(2)까지 포함돼 UIDeviceFamily가
        # [1, 2]가 되고, Release 빌드가 "모든 방향을 지원해야 한다"고 경고한다.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 서명. 무료 Apple ID의 개인 팀으로 실기기에 설치하려면 팀 ID를 환경 변수로 준다:
        #   DEVELOPMENT_TEAM=ABCDE12345 xcodegen generate
        # 비워 두면 Xcode의 Signing & Capabilities에서 고른다 (다시 generate하면 초기화된다).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        # 스토어 버전. TestFlight에 올릴 때마다 CURRENT_PROJECT_VERSION을 1씩 올린다.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 9
        # 푸시 알림(aps-environment)과 Game Center. 유료 팀이라 Xcode 자동 서명이
        # App ID의 Push Notifications·Game Center를 켠 프로파일을 받아 온다.
        CODE_SIGN_ENTITLEMENTS: App/YachtDice.entitlements
    info:
      path: App/Info.plist
      properties:
        # 한국어 UI다. 비워두면 $(DEVELOPMENT_LANGUAGE)가 en으로 풀린다.
        CFBundleDevelopmentRegion: ko
        CFBundleDisplayName: 요트 다이스
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 암호화를 쓰지 않는다. 없으면 업로드할 때마다 App Store Connect가 묻는다.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 온라인 대전을 위한 Game Center 표시
        GKGameCenterBadgingDisabled: false
    dependencies:
      - package: YachtCore
      - package: GameCore
      - package: DiceTrajectory
      - package: YachtBot
      - package: Supabase
        product: Supabase

  YachtDiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/YachtDiceTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YachtDice

  YachtDiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/YachtDiceUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YachtDice

  TrajectoryBaker:
    type: application
    platform: macOS
    sources: [Tools/TrajectoryBaker]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: DiceTrajectory

schemes:
  YachtDice:
    build:
      targets:
        YachtDice: all
    test:
      targets: [YachtDiceTests, YachtDiceUITests]
  TrajectoryBaker:
    build:
      targets:
        TrajectoryBaker: all
